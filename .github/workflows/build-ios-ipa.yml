name: Build unsigned iOS IPA

# 推送到 main 或手动触发后，在 GitHub 的 macOS 机器上自动打出未签名 .ipa，
# 下载后用「全能签 / 轻松签 / Sideloadly」导入证书签名即可装机。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add iOS platform (first run)
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Inject Info.plist keys
        run: |
          PLIST="ios/App/App/Info.plist"
          set_kv() {
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
          }
          set_kv NSLocationWhenInUseUsageDescription "用于获取你当前位置，检索周边酒店、宾馆与租房房源"
          set_kv CFBundleDisplayName "附近查一查"

          # 允许查询这些 App 是否安装（跳转美团/抖音/高德/携程用）
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          for scheme in imeituan snssdk1128 iosamap baidumap ctrip diditaxi; do
            /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes: string $scheme" "$PLIST"
          done

          echo "---- Info.plist 校验 ----"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :LSApplicationQueriesSchemes" "$PLIST"

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            PROJECT_ARGS="-workspace App.xcworkspace"
          else
            PROJECT_ARGS="-project App.xcodeproj"
          fi
          echo "使用 $PROJECT_ARGS 编译"
          xcodebuild $PROJECT_ARGS \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到编译产物 .app"
            exit 1
          fi
          echo "产物：$APP_PATH"
          rm -rf Payload jiudianchaxun-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry jiudianchaxun-unsigned.ipa Payload
          ls -lh jiudianchaxun-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiudianchaxun-unsigned-ipa
          path: jiudianchaxun-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
