# /etc/nginx/conf.d/jiudianchaxun.conf
# 用法：把 hotel.example.com 换成你自己的域名，证书路径改成阿里云 SSL 证书解压后的实际位置。
# 注意：iOS 只在 HTTPS 下允许网页定位（navigator.geolocation）与 Service Worker，
#       所以这一层 HTTPS 不是可选项，IPA 里的 ATS 也要求后端必须是 https。

server {
    listen 80;
    server_name hotel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hotel.example.com;

    ssl_certificate     /etc/nginx/cert/hotel.example.com.pem;
    ssl_certificate_key /etc/nginx/cert/hotel.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m;

    # PWA 清单与 Service Worker 别缓存太久，避免更新不生效
    location = /sw.js {
        proxy_pass http://127.0.0.1:5173;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:5173;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # AI 批量搜价 / 房源检索是串行调大模型，单次可能跑 60 秒以上
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering       off;
    }
}
